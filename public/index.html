<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C0A">
<meta name="description" content="Audiolibros gratis y podcasts en español. Clásicos de dominio público para escuchar sin pagar.">
<title>Audiolibros Gratis</title>
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0C0A; --card:#1B1815; --card2:#24201C; --ink:#F4EEE6; --muted:#9F958A; --line:rgba(244,238,230,.10);
  --accent:#E8834F; --accent-ink:#1A120C; --hl:rgba(232,131,79,.22); --track:rgba(244,238,230,.16); --shade:rgba(244,238,230,.07);
  --serif:"Fraunces",Georgia,serif; --sans:"DM Sans",system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block}
.app{max-width:520px;margin:0 auto;min-height:100vh}
.vista{padding:calc(14px + var(--safe-t)) 16px calc(170px + var(--safe-b))}
h1{font:700 26px/1.15 var(--serif);margin:0}
h2{font:700 17px/1.25 var(--sans);margin:0}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.fila-tit{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;gap:10px}
.fila-tit a,.link{font-size:13px;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none;background:none;border:0;padding:0;white-space:nowrap}

/* Portadas */
.cv{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--card);flex:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10% 10% 9%;color:#FBF1DC}
.cv .gen .a{font:700 8.5px/1.25 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.cv .gen .t{font:700 15px/1.08 var(--serif);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cv .gen::after{content:"";position:absolute;right:-16%;bottom:24%;width:62%;aspect-ratio:1;border-radius:50%;border:2px solid currentColor;opacity:.2}
.cv .tag{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:2px 5px;border-radius:4px}
.cv.pod{border-radius:12px}

/* Hero */
.hero{position:relative;margin:calc(-14px - var(--safe-t)) -16px 0;height:min(120vw,580px);overflow:hidden;display:flex;align-items:flex-end;background:#2A1630 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,10,.6) 0%,rgba(14,12,10,0) 22%,rgba(14,12,10,0) 42%,var(--bg) 97%)}
.hero .hd{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--safe-t)) 16px 14px}
.logo{font:700 19px var(--serif);letter-spacing:-.01em}.logo i{color:var(--accent);font-style:normal}
.hero .cnt{position:relative;z-index:2;width:100%;text-align:center;padding:0 16px 4px}
.kick{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:700 40px/1 var(--serif);margin:8px 0 10px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.gens{font-size:13px;color:var(--muted);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gens span+span::before{content:"·";margin-right:8px}
.bts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.hb{border:0;border-radius:8px;padding:11px 20px;font-weight:700;font-size:15px;display:inline-flex;gap:7px;align-items:center}
.hb svg{width:20px;height:20px}
.hb.w{background:#F4EEE6;color:#0E0C0A}
.hb.g{background:rgba(244,238,230,.16);color:#F4EEE6;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* Carruseles */
.carr{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;scroll-padding:0 16px}
.carr::-webkit-scrollbar{display:none}
.it{flex:none;width:124px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left}
.it .n{font-weight:700;font-size:13px;margin-top:7px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top10{flex:none;display:flex;align-items:flex-end;scroll-snap-align:start;background:none;border:0;padding:0}
.top10 .nn{font:800 110px/.8 var(--sans);color:var(--bg);-webkit-text-stroke:2.5px #6E655C;margin-right:-12px;letter-spacing:-.06em;position:relative;z-index:1}
.top10 .cv{width:104px;z-index:2}
.top10.diez .nn{letter-spacing:-.14em;margin-right:-4px}
.seg-it{flex:none;width:156px;scroll-snap-align:start;background:var(--card);border:0;padding:0;border-radius:10px;overflow:hidden;text-align:left;position:relative}
.seg-it .cv{border-radius:0;width:100%}
.seg-it .pi{padding:8px 10px 10px}
.seg-it b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-it small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-it .po{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.prog{height:3px;background:var(--track);border-radius:3px;margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}

/* Esqueleto de carga */
.sk{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* Listas y grillas */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.grid .it{width:auto;min-width:0}
.grid .it .n{font-size:12.5px}
.lista{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row .cv{width:56px}
.row .info{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row small{color:var(--muted);font-size:12.5px;display:block}
.row .ic{color:var(--muted);flex:none}
.row.on b{color:var(--accent)}
.num{width:30px;text-align:center;color:var(--muted);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.buscar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
.buscar input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.gc{border:0;border-radius:12px;height:76px;padding:12px;text-align:left;color:#fff;font:700 15px var(--sans);position:relative;overflow:hidden}
.gc::after{content:"";position:absolute;right:-14px;bottom:-14px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.16)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--shade);border-radius:12px;padding:3px;margin-top:16px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}
.vacio{text-align:center;color:var(--muted);padding:34px 16px}
.vacio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.mas{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 22px;font-weight:700}

/* Detalle */
.top-bar{display:flex;align-items:center;gap:6px;margin:-4px 0 6px}
.volver{border:0;background:none;padding:8px 4px;display:inline-flex;gap:2px;align-items:center;color:var(--ink);font-weight:700}
.volver svg{width:24px;height:24px}
.det{display:flex;flex-direction:column;align-items:center;text-align:center}
.det .cv{width:200px;box-shadow:0 20px 40px -18px rgba(0,0,0,.8)}
.det h1{margin-top:18px;font-size:25px}
.meta-l{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.meta-l span{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--muted)}
.acciones{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);flex:none;padding:14px 16px}
.btn svg{width:20px;height:20px}
.desc{font-size:15px;line-height:1.6;margin-top:18px;color:#DCD3C8;white-space:pre-line;position:relative}
.desc.corta{max-height:7.2em;overflow:hidden}
.desc.corta::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.4em;background:linear-gradient(transparent,var(--bg))}
.fuente{font-size:12px;color:var(--muted);margin-top:22px;text-align:center}

/* Mini reproductor y pestañas */
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--safe-b));width:calc(100% - 16px);max-width:504px;z-index:10;
  background:var(--card2);border-radius:12px;padding:7px 8px;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);overflow:hidden}
.mini.on{display:flex}
.mini .cv{width:42px;border-radius:6px}
.mini .info{flex:1;min-width:0;cursor:pointer}
.mini b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mp{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0}
.mbtn{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center;flex:none}
.mbtn svg{width:26px;height:26px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:10;background:rgba(14,12,10,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:5px 4px calc(5px + var(--safe-b))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;text-decoration:none}
.tabs svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{color:var(--accent)}

/* Reproductor completo */
.full{position:fixed;inset:0;background:var(--bg);z-index:30;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;visibility:hidden}
.full.on{transform:none;visibility:visible}
.full .in{max-width:520px;margin:0 auto;padding:calc(10px + var(--safe-t)) 20px calc(40px + var(--safe-b))}
.full .tp{display:flex;justify-content:space-between;align-items:center}
.full .tp small{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:center;flex:1}
.ib{background:none;border:0;padding:8px;border-radius:10px;display:inline-flex;align-items:center;gap:2px;font:700 12px var(--sans);color:var(--ink)}
.ib svg{width:26px;height:26px}
.ib:disabled{opacity:.3}
.full .cv{width:min(72vw,300px);margin:16px auto 0;border-radius:12px;box-shadow:0 24px 50px -20px rgba(0,0,0,.9)}
.full .tt{margin-top:22px}
.full .tt h2{font:700 21px/1.2 var(--serif)}
.full .tt p{margin:4px 0 0;color:var(--muted);font-size:14px}
.bar{position:relative;height:26px;display:flex;align-items:center;touch-action:none;margin-top:14px;cursor:pointer}
.bar .tr{height:4px;width:100%;background:var(--track);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;width:0;background:var(--ink)}
.bar .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink);left:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.play{width:68px;height:68px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;display:grid;place-items:center}
.play svg{width:30px;height:30px}
.extras{display:flex;justify-content:space-between;margin-top:18px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font:700 13px var(--sans);display:inline-flex;gap:6px;align-items:center}
.pill svg{width:16px;height:16px}
.pill.on{border-color:var(--accent);color:var(--accent)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.voces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.voz{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 8px;text-align:left}
.voz b{display:block;font-size:14.5px}.voz small{color:var(--muted);font-size:11.5px}
.voz[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.texto{background:var(--card);border-radius:14px;padding:18px 16px}
.texto p{font:400 17px/1.75 var(--serif);margin:0 0 14px}.texto p:last-child{margin:0}
.fr{cursor:pointer;border-radius:4px;transition:background .25s,color .25s}
.fr.on{background:var(--hl);color:var(--accent);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cargando .play svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Hoja de opciones */
.hoja-fondo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.hoja-fondo.on{display:block}
.hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:520px;z-index:41;background:var(--card2);border-radius:18px 18px 0 0;padding:10px 16px calc(20px + var(--safe-b));transition:transform .25s;max-height:75vh;overflow-y:auto}
.hoja.on{transform:translate(-50%,0)}
.hoja h3{margin:8px 0 8px;font-size:16px}
.hoja .op{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15.5px;text-align:left}
.hoja .op.on{color:var(--accent);font-weight:700}
.agarre{width:40px;height:4px;border-radius:4px;background:var(--track);margin:0 auto 6px}

.toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><main id="vista" class="vista"></main></div>

<div class="mini" id="mini">
  <div class="cv" id="mini-cv"></div>
  <div class="info" id="mini-info"><b id="mini-t"></b><small id="mini-s"></small></div>
  <button class="mbtn" id="mini-play" aria-label="Reproducir"></button>
  <div class="mp" id="mini-p"></div>
</div>

<nav class="tabs" id="tabs">
  <a href="#/" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Inicio</a>
  <a href="#/explorar" data-tab="explorar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</a>
  <a href="#/podcasts" data-tab="podcasts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Podcasts</a>
  <a href="#/biblioteca" data-tab="biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 2.5 15-3.5 1z"/></svg>Biblioteca</a>
</nav>

<div class="full" id="full" aria-hidden="true">
  <div class="in">
    <div class="tp">
      <button class="ib" id="f-cerrar" aria-label="Cerrar reproductor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <small id="f-tipo">Reproduciendo</small>
      <button class="ib" id="f-caps" aria-label="Capítulos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    </div>
    <div class="cv" id="f-cv"></div>
    <div class="tt"><h2 id="f-t"></h2><p id="f-s"></p></div>
    <div class="bar" id="bar"><div class="tr"><div class="fill" id="fill"></div></div><div class="knob" id="knob"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">-0:00</span></div>
    <div class="ctrls">
      <button class="ib" id="ant" aria-label="Capítulo anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
      <button class="ib" id="atras" aria-label="Atrás 15 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>15</button>
      <button class="play" id="play" aria-label="Reproducir"></button>
      <button class="ib" id="adel" aria-label="Adelante 30 segundos">30<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <button class="ib" id="sig" aria-label="Capítulo siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM14.5 12 6 18V6z"/></svg></button>
    </div>
    <div class="extras">
      <button class="pill" id="vel">1×</button>
      <button class="pill" id="sueno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="sueno-t">Dormir</span></button>
      <button class="pill" id="f-ir">Ver ficha</button>
    </div>
    <div id="f-voces" hidden><p class="lbl">Voz del narrador</p><div class="voces" id="voces"></div></div>
    <div id="f-texto" hidden><p class="lbl">Texto</p><div class="texto" id="texto"></div></div>
  </div>
</div>

<div class="hoja-fondo" id="hoja-fondo"></div>
<div class="hoja" id="hoja"></div>
<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="metadata"></audio>

<script>
"use strict";
// ================= Base =================
const NATIVO = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const API = NATIVO ? "https://audiolibros.dmith.app" : "";
const abs = u => (u && u.startsWith("/")) ? API + u : u;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICO = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  carga:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
  mas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>',
  volver:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>',
  playC:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>'
};

async function api(ruta){
  const r = await fetch(API + ruta);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "No pudimos cargar esto.");
  return d;
}

function fmt(s){ s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,"0"); return h ? h + ":" + String(m).padStart(2,"0") + ":" + x : m + ":" + x; }
function largo(s){ s = Math.round(s || 0); if (!s) return ""; const h = Math.floor(s/3600), m = Math.round(s%3600/60); return h ? h + " h" + (m ? " " + m + " min" : "") : Math.max(1, m) + " min"; }
function fecha(iso){ if (!iso) return ""; const d = new Date(iso), hoy = new Date(); const dias = Math.floor((hoy - d) / 864e5);
  if (dias < 1) return "Hoy"; if (dias < 2) return "Ayer"; if (dias < 7) return "Hace " + dias + " días";
  return d.toLocaleDateString("es-AR", {day:"numeric", month:"short", year: d.getFullYear() === hoy.getFullYear() ? undefined : "numeric"}); }

// ================= Estado guardado en el teléfono =================
const CLAVE = "ag:v1";
let E = { progreso:{}, recientes:[], lista:[], subs:[], voz:"ef_dora", vel:1 };
try { Object.assign(E, JSON.parse(localStorage.getItem(CLAVE) || "{}")); } catch (e) {}
let guardarT = null;
function guardar(){ clearTimeout(guardarT); guardarT = setTimeout(() => { try { localStorage.setItem(CLAVE, JSON.stringify(E)); } catch (e) {} }, 300); }
const corto = x => ({ id:x.id, tipo:x.tipo, titulo:x.titulo, autor:x.autor, portada:x.portada });
const enLista = x => E.lista.some(l => l.id === x.id && l.tipo === x.tipo);
const suscripto = id => E.subs.some(s => s.id === id);

// ================= Portadas =================
const PALETA = [["#7C2D12","#3B1206"],["#1F5130","#0C2615"],["#3B3470","#16123A"],["#8A5A1F","#3E2608"],["#1D4E89","#0A2244"],["#5B1A2B","#24060F"],["#2F5D62","#0F2A2D"],["#6B6B2A","#2B2B0C"]];
function hash(s){ let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function genCover(x){ const p = PALETA[hash(x.titulo) % PALETA.length];
  return '<div class="gen" style="background:linear-gradient(160deg,' + p[0] + ',' + p[1] + ')"><div class="a">' + esc(x.autor || "") + '</div><div class="t">' + esc(x.titulo) + '</div></div>'; }
function cover(x, cls = "", tag = ""){
  const pod = x.tipo === "podcast" ? " pod" : "";
  const img = x.portada ? '<img loading="lazy" decoding="async" alt="" src="' + esc(abs(x.portada)) + '" onerror="this.outerHTML=this.dataset.gen" data-gen="' + esc(genCover(x)) + '">' : genCover(x);
  return '<div class="cv' + pod + (cls ? " " + cls : "") + '">' + img + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</div>';
}
// Algunas portadas de archive.org vienen vacías (imagen genérica muy chica): las reemplazamos.
document.addEventListener("load", e => {
  const im = e.target; if (im.tagName === "IMG" && im.dataset.gen && im.naturalWidth && im.naturalWidth < 60) im.outerHTML = im.dataset.gen;
}, true);

const ruta = x => x.tipo === "podcast" ? "#/podcast/" + x.id : "#/libro/" + encodeURIComponent(x.id);
function item(x){
  const m = x.tipo === "podcast" ? (x.autor || "Podcast") : (x.autor || "");
  return '<a class="it" href="' + ruta(x) + '" style="text-decoration:none;color:inherit">' + cover(x, "", x.propio ? "NUEVO" : "") + '<div class="n">' + esc(x.titulo) + '</div><div class="m">' + esc(m) + '</div></a>';
}
function row(x, extra = ""){
  const sub = x.tipo === "podcast" ? "Podcast · " + esc(x.autor || "") : esc(x.autor || "");
  return '<a class="row" href="' + ruta(x) + '" style="color:inherit;text-decoration:none">' + cover(x) + '<div class="info"><b>' + esc(x.titulo) + '</b><small>' + sub + '</small>' + extra + '</div></a>';
}
const skFila = (n = 5) => '<div class="carr">' + Array.from({length:n}, () => '<div class="it"><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="height:12px;margin-top:8px;width:80%"></div></div>').join("") + '</div>';
const error = (msg, reintentar) => '<div class="vacio"><b>Uy, algo falló</b>' + esc(msg) + '<br><button class="mas" onclick="' + reintentar + '">Reintentar</button></div>';

// ================= Navegación =================
const V = $("vista");
let scrolls = {};
function rutaActual(){ return (location.hash || "#/").slice(1); }
function marcarTab(t){ document.querySelectorAll("#tabs a").forEach(a => a.getAttribute("data-tab") === t ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current")); }
let rutaPrevia = null;
async function router(){
  const r = rutaActual();
  if (r === "/reproductor") { if (P.item) abrirFull(); else location.replace("#/"); return; }
  cerrarFull(true);
  if (rutaPrevia) scrolls[rutaPrevia] = scrollY;
  rutaPrevia = r;
  const p = r.split("/").filter(Boolean);
  const tab = { explorar:"explorar", cat:"explorar", podcasts:"podcasts", podcast:"podcasts", biblioteca:"biblioteca" }[p[0]] || "inicio";
  marcarTab(tab);
  try {
    if (!p.length) await vInicio();
    else if (p[0] === "explorar") vExplorar(decodeURIComponent(p[1] || ""));
    else if (p[0] === "cat") await vCategoria(p[1], p[2]);
    else if (p[0] === "podcasts") await vPodcasts();
    else if (p[0] === "biblioteca") vBiblioteca(p[1] || "escuchando");
    else if (p[0] === "libro") await vLibro(decodeURIComponent(p[1]));
    else if (p[0] === "podcast") await vPodcast(p[1]);
    else await vInicio();
  } catch (e) { V.innerHTML = barraVolver() + error(e.message, "router()"); }
  requestAnimationFrame(() => scrollTo(0, scrolls[r] || 0));
}
addEventListener("hashchange", router);
function barraVolver(){ return '<div class="top-bar"><button class="volver" onclick="history.length > 1 ? history.back() : location.replace(\'#/\')">' + ICO.volver + '</button></div>'; }

// ================= Inicio =================
let cacheInicio = null;
async function vInicio(){
  if (!cacheInicio) {
    V.innerHTML = '<div class="hero"></div><div class="fila-tit"><div class="sk" style="height:16px;width:50%"></div></div>' + skFila() + '<div class="fila-tit"><div class="sk" style="height:16px;width:40%"></div></div>' + skFila();
    cacheInicio = await api("/api/inicio");
  }
  const d = cacheInicio, h = d.destacado;
  let html = '<div class="hero" style="background-image:url(\'' + esc(abs(h.imagen)) + '\')"><div class="hd"><span class="logo">audiolibros <i>gratis</i></span></div>' +
    '<div class="cnt"><div class="kick">' + esc(h.etiqueta) + '</div><h1>' + esc(h.titulo) + '</h1><div class="gens">' + h.generos.map(g => '<span>' + esc(g) + '</span>').join("") + '</div>' +
    '<div class="bts"><button class="hb w" id="h-play">' + ICO.play + 'Escuchar</button><button class="hb g" id="h-lista"></button><a class="hb g" href="#/libro/' + encodeURIComponent(h.id) + '" aria-label="Más información"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></a></div></div></div>';

  const rec = E.recientes.slice(0, 12);
  if (rec.length) {
    html += '<div class="fila-tit"><h2>Seguir escuchando</h2><a href="#/biblioteca">Ver todo</a></div><div class="carr">' + rec.map((r, i) => {
      const pr = E.progreso[r.pista.url] || {}; const pct = pr.dur ? Math.min(100, pr.t / pr.dur * 100) : 0;
      return '<button class="seg-it" data-rec="' + i + '">' + cover(r.item) + '<span class="po">' + ICO.play.replace('<svg', '<svg width="18" height="18"') + '</span><div class="pi"><b>' + esc(r.item.titulo) + '</b><small>' + esc(r.pista.titulo) + '</small><div class="prog"><i style="width:' + pct + '%"></i></div></div></button>';
    }).join("") + '</div>';
  }
  for (const f of d.filas) {
    const ver = f.cat !== undefined ? '<a href="#/cat/libros/' + (f.cat || "todos") + '">Ver todo</a>' : f.id.startsWith("pod") || f.id === "top-pods" ? '<a href="#/podcasts">Ver todo</a>' : "";
    html += '<div class="fila-tit"><h2>' + esc(f.titulo) + '</h2>' + ver + '</div><div class="carr">';
    if (f.estilo === "top10") html += f.items.map((x, i) => '<a class="top10' + (i === 9 ? " diez" : "") + '" href="' + ruta(x) + '" aria-label="' + (i + 1) + ". " + esc(x.titulo) + '"><span class="nn">' + (i + 1) + '</span>' + cover(x) + '</a>').join("");
    else html += f.items.map(item).join("");
    html += '</div>';
  }
  html += '<p class="fuente">Audiolibros de dominio público grabados por voluntarios de LibriVox y alojados en archive.org.<br>Podcasts del directorio público de Apple Podcasts.</p>';
  V.innerHTML = html;
  const hl = $("h-lista"), x = { id:h.id, tipo:"libro", titulo:h.titulo, autor:h.autor, portada:"/contenido/quijote/portada.jpg" };
  const pintarL = () => hl.innerHTML = enLista(x) ? ICO.ok + "En mi lista" : ICO.mas + "Mi lista";
  pintarL(); hl.onclick = () => { alternarLista(x); pintarL(); };
  $("h-play").onclick = () => escucharLibro(h.id);
  V.querySelectorAll("[data-rec]").forEach(b => b.onclick = () => { const r = E.recientes[+b.dataset.rec]; continuar(r); });
}

// ================= Buscar / Explorar =================
let cats = null, tBusq = null;
function vExplorar(q){
  V.innerHTML = '<h1>Buscar</h1><label class="buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Títulos, autores, podcasts" value="' + esc(q) + '"></label><div id="res"></div>';
  const inp = $("q");
  inp.oninput = () => { clearTimeout(tBusq); tBusq = setTimeout(() => { history.replaceState(null, "", "#/explorar/" + encodeURIComponent(inp.value.trim())); rutaPrevia = rutaActual(); buscar(inp.value.trim()); }, 350); };
  buscar(q);
}
async function buscar(q){
  const res = $("res"); if (!res) return;
  if (q.length < 2) {
    if (!cats) { try { cats = await api("/api/categorias"); } catch (e) { res.innerHTML = error(e.message, "vExplorar('')"); return; } }
    const col = ["#7C2D12","#1F5130","#3B3470","#B07A12","#1D4E89","#5B1A2B","#2F5D62","#5C3B26"];
    res.innerHTML = '<div class="fila-tit"><h2>Audiolibros por género</h2></div><div class="g2">' + cats.libros.map((c, i) => '<a class="gc" href="#/cat/libros/' + c.id + '" style="background:linear-gradient(140deg,' + col[i % 8] + ',' + col[i % 8] + 'aa);text-decoration:none">' + esc(c.nombre) + '</a>').join("") + '</div>' +
      '<div class="fila-tit"><h2>Podcasts por tema</h2></div><div class="g2">' + cats.podcasts.map((c, i) => '<a class="gc" href="#/cat/podcasts/' + c.id + '" style="background:linear-gradient(140deg,' + col[(i + 3) % 8] + ',' + col[(i + 3) % 8] + 'aa);text-decoration:none">' + esc(c.nombre) + '</a>').join("") + '</div>';
    return;
  }
  res.innerHTML = '<div class="lista" style="margin-top:10px">' + Array.from({length:6}, () => '<div class="row"><div class="sk" style="width:56px;height:56px"></div><div class="info"><div class="sk" style="height:13px;width:70%"></div><div class="sk" style="height:11px;width:40%;margin-top:6px"></div></div></div>').join("") + '</div>';
  try {
    const d = await api("/api/buscar?q=" + encodeURIComponent(q));
    if ($("q") && $("q").value.trim() !== q) return;
    if (!d.libros.length && !d.podcasts.length) { res.innerHTML = '<div class="vacio"><b>Sin resultados</b>No encontramos nada con "' + esc(q) + '". Probá con el autor o con otra palabra.</div>'; return; }
    let h = "";
    if (d.libros.length) h += '<div class="fila-tit"><h2>Audiolibros</h2></div><div class="lista">' + d.libros.slice(0, 20).map(x => row(x)).join("") + '</div>';
    if (d.podcasts.length) h += '<div class="fila-tit"><h2>Podcasts</h2></div><div class="lista">' + d.podcasts.slice(0, 15).map(x => row(x)).join("") + '</div>';
    res.innerHTML = h;
  } catch (e) { res.innerHTML = error(e.message, "buscar(document.getElementById('q').value.trim())"); }
}

async function vCategoria(tipo, id){
  if (!cats) cats = await api("/api/categorias");
  const lista = tipo === "podcasts" ? cats.podcasts : cats.libros;
  const c = lista.find(x => x.id === id) || { nombre: tipo === "podcasts" ? "Podcasts" : "Más escuchados" };
  V.innerHTML = barraVolver() + '<h1>' + esc(c.nombre) + '</h1><p class="sub">' + (tipo === "podcasts" ? "Podcasts" : "Audiolibros gratis") + '</p><div class="grid" id="g" style="margin-top:18px">' +
    Array.from({length:9}, () => '<div><div class="sk" style="aspect-ratio:1"></div></div>').join("") + '</div><div id="g-mas"></div>';
  let pagina = 1;
  const cargar = async () => {
    const d = tipo === "podcasts" ? await api("/api/podcasts?genero=" + encodeURIComponent(id)) : await api("/api/libros?pagina=" + pagina + (id && id !== "todos" ? "&cat=" + encodeURIComponent(id) : ""));
    const items = tipo === "podcasts" ? d.podcasts : d.libros;
    const g = $("g"); if (!g) return;
    if (pagina === 1) g.innerHTML = "";
    g.insertAdjacentHTML("beforeend", items.map(item).join(""));
    if (!g.children.length) g.outerHTML = '<div class="vacio"><b>Nada por acá todavía</b>Probá con otro género.</div>';
    const m = $("g-mas");
    if (tipo !== "podcasts" && d.total > pagina * 30) { m.innerHTML = '<button class="mas">Cargar más</button>'; m.firstChild.onclick = () => { pagina++; m.innerHTML = ""; cargar(); }; }
  };
  await cargar();
}

// ================= Podcasts =================
let cacheTop = null;
async function vPodcasts(){
  if (!cats) cats = await api("/api/categorias").catch(() => null);
  let h = '<h1>Podcasts</h1>';
  if (E.subs.length) h += '<div class="fila-tit"><h2>Tus podcasts</h2></div><div class="carr">' + E.subs.map(item).join("") + '</div>';
  if (cats) h += '<div class="fila-tit"><h2>Temas</h2></div><div class="chips">' + cats.podcasts.map(c => '<a class="chip" href="#/cat/podcasts/' + c.id + '" style="color:inherit;text-decoration:none">' + esc(c.nombre) + '</a>').join("") + '</div>';
  h += '<div class="fila-tit"><h2>Los más escuchados</h2></div><div class="lista" id="top">' + (cacheTop ? "" : Array.from({length:6}, () => '<div class="row"><div class="sk" style="width:56px;height:56px"></div><div class="info"><div class="sk" style="height:13px;width:70%"></div></div></div>').join("")) + '</div>';
  V.innerHTML = h;
  if (!cacheTop) cacheTop = (await api("/api/podcasts")).podcasts;
  if ($("top")) $("top").innerHTML = cacheTop.map((x, i) => row(x).replace('<div class="cv', '<span class="num">' + (i + 1) + '</span><div class="cv')).join("");
}

// ================= Biblioteca =================
function vBiblioteca(s){
  const segs = [["escuchando","Escuchando"],["lista","Mi lista"],["podcasts","Podcasts"]];
  let h = '<h1>Biblioteca</h1><div class="seg">' + segs.map(([id, n]) => '<button aria-pressed="' + (id === s) + '" onclick="location.replace(\'#/biblioteca/' + id + '\')">' + n + '</button>').join("") + '</div><div class="lista" style="margin-top:8px">';
  if (s === "escuchando") {
    h += E.recientes.length ? E.recientes.map((r, i) => {
      const pr = E.progreso[r.pista.url] || {}; const pct = pr.dur ? Math.min(100, pr.t / pr.dur * 100) : 0;
      return '<button class="row" data-rec="' + i + '">' + cover(r.item) + '<div class="info"><b>' + esc(r.item.titulo) + '</b><small>' + esc(r.pista.titulo) + '</small><div class="prog"><i style="width:' + pct + '%"></i></div></div><span class="ic">' + ICO.playC + '</span></button>';
    }).join("") : '<div class="vacio"><b>Todavía no escuchaste nada</b>Lo que empieces a escuchar aparece acá para seguir donde lo dejaste.</div>';
  } else if (s === "lista") {
    h += E.lista.length ? E.lista.map(x => row(x)).join("") : '<div class="vacio"><b>Tu lista está vacía</b>Tocá "+ Mi lista" en cualquier libro para guardarlo.</div>';
  } else {
    h += E.subs.length ? E.subs.map(x => row(x)).join("") : '<div class="vacio"><b>No seguís ningún podcast</b>Tocá "Seguir" en un podcast y lo vas a tener siempre a mano.</div>';
  }
  V.innerHTML = h + '</div>';
  V.querySelectorAll("[data-rec]").forEach(b => b.onclick = () => continuar(E.recientes[+b.dataset.rec]));
}

// ================= Ficha de libro =================
const fichas = {};
async function traerLibro(id){ return fichas["l:" + id] || (fichas["l:" + id] = await api("/api/libro/" + encodeURIComponent(id))); }
async function vLibro(id){
  V.innerHTML = barraVolver() + '<div class="det"><div class="sk" style="width:200px;aspect-ratio:1"></div><div class="sk" style="height:22px;width:70%;margin-top:18px"></div></div>';
  const b = await traerLibro(id);
  const ult = E.recientes.find(r => r.item.id === b.id && r.item.tipo === "libro");
  const tags = [b.licencia === "Dominio público" ? "Gratis" : "", largo(b.duracion), b.capitulos.length + (b.capitulos.length === 1 ? " capítulo" : " capítulos"), b.voces ? "3 voces" : ""].filter(Boolean);
  V.innerHTML = barraVolver() + '<div class="det">' + cover(b) + '<h1>' + esc(b.titulo) + '</h1><p class="sub">' + esc(b.autor) + '</p><div class="meta-l">' + tags.map(t => '<span>' + esc(t) + '</span>').join("") + '</div></div>' +
    '<div class="acciones"><button class="btn" id="d-play">' + ICO.play + (ult ? "Seguir escuchando" : "Escuchar") + '</button><button class="btn sec" id="d-lista" aria-label="Mi lista"></button></div>' +
    (b.descripcion ? '<div class="desc corta" id="d-desc">' + esc(b.descripcion) + '</div><button class="link" id="d-mas" style="margin-top:6px">Leer más</button>' : '') +
    '<div class="fila-tit"><h2>Capítulos</h2></div><div class="lista" id="d-caps">' + b.capitulos.map((c, i) => {
      const pr = E.progreso[c.url]; const visto = pr && pr.dur && pr.t / pr.dur > .95;
      return '<button class="row" data-i="' + i + '"><span class="num">' + (visto ? "✓" : c.n) + '</span><div class="info"><b>' + esc(c.titulo) + '</b><small>' + (c.duracion ? fmt(c.duracion) : "") + (pr && !visto && pr.t > 5 ? " · quedan " + largo(pr.dur - pr.t) : "") + '</small></div></button>';
    }).join("") + '</div>' +
    '<p class="fuente">' + (b.lectores && b.lectores.length ? "Leído por " + esc(b.lectores.join(", ")) + "<br>" : "") + esc(b.fuente) + " · " + esc(b.licencia) + '</p>';
  const dl = $("d-lista"), x = corto(b);
  const pintar = () => dl.innerHTML = enLista(x) ? ICO.ok : ICO.mas;
  pintar(); dl.onclick = () => { alternarLista(x); pintar(); };
  $("d-play").onclick = () => ult ? continuar(ult) : reproducir(b, b.capitulos, 0);
  V.querySelectorAll("#d-caps [data-i]").forEach(r => r.onclick = () => reproducir(b, b.capitulos, +r.dataset.i));
  if ($("d-mas")) { const d = $("d-desc"); if (d.scrollHeight <= d.clientHeight + 4) { d.classList.remove("corta"); $("d-mas").remove(); } else $("d-mas").onclick = e => { d.classList.remove("corta"); e.target.remove(); }; }
  marcarSonando();
}
async function escucharLibro(id){
  const ult = E.recientes.find(r => r.item.id === id);
  if (ult) return continuar(ult);
  try { const b = await traerLibro(id); reproducir(b, b.capitulos, 0); } catch (e) { toast(e.message); }
}
function alternarLista(x){
  const i = E.lista.findIndex(l => l.id === x.id && l.tipo === x.tipo);
  if (i >= 0) { E.lista.splice(i, 1); toast("Lo sacamos de tu lista."); } else { E.lista.unshift(corto(x)); toast("Agregado a Mi lista."); }
  guardar();
}

// ================= Ficha de podcast =================
async function vPodcast(id){
  V.innerHTML = barraVolver() + '<div class="det"><div class="sk" style="width:200px;aspect-ratio:1;border-radius:12px"></div><div class="sk" style="height:22px;width:70%;margin-top:18px"></div></div>';
  const p = fichas["p:" + id] || (fichas["p:" + id] = await api("/api/podcast/" + id));
  V.innerHTML = barraVolver() + '<div class="det">' + cover(p) + '<h1>' + esc(p.titulo) + '</h1><p class="sub">' + esc(p.autor) + '</p><div class="meta-l">' + [p.genero, p.episodios.length + " episodios"].filter(Boolean).map(t => '<span>' + esc(t) + '</span>').join("") + '</div></div>' +
    '<div class="acciones"><button class="btn" id="p-sus"></button><button class="btn sec" id="p-ult" aria-label="Escuchar el último">' + ICO.play + '</button></div>' +
    (p.descripcion ? '<div class="desc corta" id="d-desc">' + esc(p.descripcion) + '</div><button class="link" id="d-mas" style="margin-top:6px">Leer más</button>' : '') +
    '<div class="fila-tit"><h2>Episodios</h2></div><div class="lista" id="d-caps">' + (p.episodios.length ? p.episodios.map((e, i) => {
      const pr = E.progreso[e.url]; const visto = pr && pr.dur && pr.t / pr.dur > .95;
      return '<button class="row" data-i="' + i + '"><div class="info"><small>' + esc(fecha(e.fecha)) + '</small><b>' + esc(e.titulo) + '</b><small>' + (visto ? "Escuchado" : e.duracion ? largo(e.duracion) + (pr && pr.t > 5 ? " · quedan " + largo(pr.dur - pr.t) : "") : "") + '</small></div><span class="ic">' + ICO.playC + '</span></button>';
    }).join("") : '<div class="vacio">Este podcast no tiene episodios para escuchar.</div>') + '</div>' +
    '<p class="fuente">El audio se reproduce desde el servidor del podcast.</p>';
  const bs = $("p-sus"), x = corto(p);
  const pintar = () => { const s = suscripto(p.id); bs.innerHTML = s ? ICO.ok + "Siguiendo" : ICO.mas + "Seguir"; bs.className = s ? "btn sec" : "btn"; bs.style.flex = "1"; };
  pintar(); bs.onclick = () => { const i = E.subs.findIndex(s => s.id === p.id); if (i >= 0) E.subs.splice(i, 1); else { E.subs.unshift(x); toast("Ahora seguís " + p.titulo + "."); } guardar(); pintar(); };
  const pistas = p.episodios.map(e => ({ titulo:e.titulo, url:e.url, duracion:e.duracion, portada:e.portada }));
  $("p-ult").onclick = () => pistas.length && reproducir(p, pistas, 0, false);
  V.querySelectorAll("#d-caps [data-i]").forEach(r => r.onclick = () => reproducir(p, pistas, +r.dataset.i, false));
  if ($("d-mas")) { const d = $("d-desc"); if (d.scrollHeight <= d.clientHeight + 4) { d.classList.remove("corta"); $("d-mas").remove(); } else $("d-mas").onclick = e => { d.classList.remove("corta"); e.target.remove(); }; }
  marcarSonando();
}

// ================= Reproductor =================
const A = $("audio");
const P = { item:null, pistas:[], i:0, seguido:true, texto:null };
const VELS = [1, 1.25, 1.5, 1.75, 2, .75];
let VOCES = [];

function pistaUrl(p){ return abs(p.voces ? (p.voces[E.voz] || p.url) : p.url); }
function claveProg(p){ return p.url; }

// seguido = al terminar un capítulo pasa al siguiente (libros sí, podcasts no)
function reproducir(item, pistas, i, seguido = true, desde = null){
  P.item = corto(item); P.pistas = pistas; P.i = i; P.seguido = seguido;
  cargarPista(desde, true);
  abrirMini();
}
function continuar(r){
  // r = { item, pistas, i, pista }
  reproducir(r.item, r.pistas, r.i, r.item.tipo === "libro");
}
async function cargarPista(desde, tocar){
  const p = P.pistas[P.i]; if (!p) return;
  const pr = E.progreso[claveProg(p)];
  const t0 = desde != null ? desde : (pr && pr.dur && pr.t / pr.dur < .97 ? Math.max(0, pr.t - 3) : 0);
  $("full").classList.add("cargando"); pintarPlay(true);
  A.src = pistaUrl(p);
  A.playbackRate = E.vel;
  A.addEventListener("loadedmetadata", function f(){ A.removeEventListener("loadedmetadata", f); if (t0) A.currentTime = Math.min(t0, (A.duration || t0 + 1) - 1); A.playbackRate = E.vel; }, { once:true });
  if (tocar) A.play().catch(() => { $("full").classList.remove("cargando"); pintarPlay(); });
  pintarFicha();
  registrarReciente();
  // Texto y voces (solo libros narrados por nosotros)
  $("f-voces").hidden = !p.voces;
  P.texto = null; $("f-texto").hidden = true; $("texto").innerHTML = "";
  if (p.texto) {
    try {
      const t = await (await fetch(abs(p.texto))).json();
      if (P.pistas[P.i] !== p) return;
      P.texto = t; pintarTexto();
    } catch (e) {}
  }
  if (p.voces && !VOCES.length) { try { VOCES = (await (await fetch(abs("/contenido/propios.json"))).json()).voces; } catch (e) {} }
  pintarVoces();
}
function registrarReciente(){
  const p = P.pistas[P.i];
  const r = { item:P.item, pistas:P.pistas.length > 60 ? P.pistas.slice(Math.max(0, P.i - 10), P.i + 50) : P.pistas, i:0, pista:{ titulo:p.titulo, url:p.url } };
  r.i = r.pistas.indexOf(p);
  E.recientes = [r].concat(E.recientes.filter(x => !(x.item.id === P.item.id && x.item.tipo === P.item.tipo))).slice(0, 30);
  guardar();
}
function pintarFicha(){
  const p = P.pistas[P.i], x = P.item;
  const img = Object.assign({}, x, p.portada ? { portada:p.portada } : {});
  $("mini-cv").outerHTML = cover(img).replace('class="cv', 'id="mini-cv" class="cv');
  $("f-cv").outerHTML = cover(img).replace('class="cv', 'id="f-cv" class="cv');
  $("mini-t").textContent = x.tipo === "podcast" ? p.titulo : x.titulo;
  $("mini-s").textContent = x.tipo === "podcast" ? x.titulo : p.titulo;
  $("f-t").textContent = x.tipo === "podcast" ? p.titulo : x.titulo;
  $("f-s").textContent = x.tipo === "podcast" ? x.titulo : (x.autor ? x.autor + " · " : "") + p.titulo;
  $("f-tipo").textContent = x.tipo === "podcast" ? "Podcast" : "Capítulo " + (P.i + 1) + " de " + P.pistas.length;
  $("ant").disabled = P.i <= 0 && x.tipo === "libro";
  $("sig").disabled = P.i >= P.pistas.length - 1;
  $("vel").textContent = E.vel + "×";
  $("vel").classList.toggle("on", E.vel !== 1);
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title:$("f-t").textContent, artist:x.tipo === "podcast" ? x.titulo : x.autor, album:x.tipo === "podcast" ? x.autor : p.titulo,
      artwork: img.portada ? [{ src:abs(img.portada), sizes:"512x512", type:"image/jpeg" }] : [] });
  }
  marcarSonando();
}
function marcarSonando(){
  if (!P.item) return;
  const r = rutaActual();
  if (r === ruta(P.item).slice(1)) V.querySelectorAll("#d-caps [data-i]").forEach(b => b.classList.toggle("on", +b.dataset.i === P.i && P.pistas[P.i] && P.pistas[P.i].url === (P.pistas[+b.dataset.i] || {}).url));
}
function pintarPlay(cargando){
  const sonando = !A.paused;
  const ico = cargando ? ICO.carga : sonando ? ICO.pause : ICO.play;
  $("play").innerHTML = ico; $("mini-play").innerHTML = ico;
  $("play").setAttribute("aria-label", sonando ? "Pausar" : "Reproducir");
  $("mini-play").setAttribute("aria-label", sonando ? "Pausar" : "Reproducir");
}
function abrirMini(){ $("mini").classList.add("on"); }
function abrirFull(){ $("full").classList.add("on"); $("full").setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
function cerrarFull(silencioso){
  if (!$("full").classList.contains("on")) return;
  $("full").classList.remove("on"); $("full").setAttribute("aria-hidden", "true"); document.body.style.overflow = "";
  if (!silencioso && rutaActual() === "/reproductor") history.back();
}
$("mini").onclick = e => { if (!e.target.closest("#mini-play")) location.hash = "#/reproductor"; };
$("f-cerrar").onclick = () => rutaActual() === "/reproductor" ? history.back() : cerrarFull(true);
$("f-ir").onclick = () => { const r = ruta(P.item); cerrarFull(true); location.replace(r); };

const alternar = () => { if (!A.src) return; A.paused ? A.play().catch(() => {}) : A.pause(); };
$("play").onclick = alternar; $("mini-play").onclick = alternar;
const saltar = s => { if (A.duration) A.currentTime = Math.max(0, Math.min(A.duration - .5, A.currentTime + s)); };
$("atras").onclick = () => saltar(-15);
$("adel").onclick = () => saltar(30);
function irPista(d){ const n = P.i + d; if (n < 0 || n >= P.pistas.length) { if (d < 0) A.currentTime = 0; return; } guardarProgreso(); P.i = n; cargarPista(null, true); }
$("ant").onclick = () => (A.currentTime > 5 && P.item.tipo === "libro") ? (A.currentTime = 0) : irPista(-1);
$("sig").onclick = () => irPista(1);
$("vel").onclick = () => { E.vel = VELS[(VELS.indexOf(E.vel) + 1) % VELS.length]; A.playbackRate = E.vel; guardar(); pintarFicha(); };

A.onplay = () => pintarPlay();
A.onplaying = () => { $("full").classList.remove("cargando"); pintarPlay(); };
A.onwaiting = () => pintarPlay(true);
A.onpause = () => { pintarPlay(); guardarProgreso(); };
A.onerror = () => { $("full").classList.remove("cargando"); pintarPlay(); if (A.src) toast("No pudimos reproducir este audio. Probá con otro capítulo."); };
A.onended = () => {
  guardarProgreso(true);
  if (finCapitulo) { finCapitulo = false; pintarSueno(0); toast("Buenas noches. Seguís mañana desde acá."); return; }
  if (P.seguido && P.i < P.pistas.length - 1) irPista(1);
};

let ultGuardado = 0;
function guardarProgreso(fin){
  const p = P.pistas[P.i]; if (!p || !A.duration || !isFinite(A.duration)) return;
  E.progreso[claveProg(p)] = { t: fin ? A.duration : A.currentTime, dur: A.duration, ts: Date.now() };
  const k = Object.keys(E.progreso); if (k.length > 800) k.sort((a, b) => E.progreso[a].ts - E.progreso[b].ts).slice(0, 200).forEach(x => delete E.progreso[x]);
  guardar();
}
let ultimaFr = null;
A.ontimeupdate = () => {
  const d = A.duration || (P.pistas[P.i] || {}).duracion || 0, t = A.currentTime;
  const pct = d ? Math.min(100, t / d * 100) : 0;
  if (!arrastrando) { $("fill").style.width = pct + "%"; $("knob").style.left = pct + "%"; }
  $("mini-p").style.width = pct + "%";
  $("cur").textContent = fmt(t); $("dur").textContent = "-" + fmt((d - t) / (E.vel || 1));
  if (Date.now() - ultGuardado > 5000) { ultGuardado = Date.now(); guardarProgreso(); }
  if (P.texto) resaltar(t);
  if ("mediaSession" in navigator && d && navigator.mediaSession.setPositionState) { try { navigator.mediaSession.setPositionState({ duration:d, position:Math.min(t, d), playbackRate:A.playbackRate }); } catch (e) {} }
};

// Barra de progreso arrastrable
let arrastrando = false;
function posBarra(e){ const r = $("bar").getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
$("bar").addEventListener("pointerdown", e => { if (!A.duration) return; arrastrando = true; $("bar").setPointerCapture(e.pointerId); const x = posBarra(e); $("fill").style.width = x * 100 + "%"; $("knob").style.left = x * 100 + "%"; });
$("bar").addEventListener("pointermove", e => { if (!arrastrando) return; const x = posBarra(e); $("fill").style.width = x * 100 + "%"; $("knob").style.left = x * 100 + "%"; $("cur").textContent = fmt(x * A.duration); });
$("bar").addEventListener("pointerup", e => { if (!arrastrando) return; arrastrando = false; A.currentTime = posBarra(e) * A.duration; });

// Controles de la pantalla bloqueada
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => A.play());
  ms.setActionHandler("pause", () => A.pause());
  ms.setActionHandler("seekbackward", () => saltar(-15));
  ms.setActionHandler("seekforward", () => saltar(30));
  try { ms.setActionHandler("previoustrack", () => irPista(-1)); ms.setActionHandler("nexttrack", () => irPista(1)); ms.setActionHandler("seekto", e => { A.currentTime = e.seekTime; }); } catch (e) {}
}

// Temporizador para dormir
let sueñoT = null, finCapitulo = false;
function pintarSueno(min){ $("sueno-t").textContent = min === "fin" ? "Fin del capítulo" : min ? min + " min" : "Dormir"; $("sueno").classList.toggle("on", !!min); }
$("sueno").onclick = () => hoja("Apagar en…", [["Desactivado", 0], ["15 minutos", 15], ["30 minutos", 30], ["45 minutos", 45], ["1 hora", 60], ["Al terminar el capítulo", "fin"]], v => {
  clearTimeout(sueñoT); finCapitulo = false;
  if (v === "fin") finCapitulo = true;
  else if (v) sueñoT = setTimeout(() => { A.pause(); pintarSueno(0); }, v * 60000);
  pintarSueno(v);
});

// Lista de capítulos / episodios
$("f-caps").onclick = () => hoja(P.item.tipo === "podcast" ? "Episodios" : "Capítulos", P.pistas.map((p, i) => [(P.item.tipo === "libro" ? (i + 1) + ". " : "") + p.titulo, i]), i => { if (i !== P.i) { guardarProgreso(); P.i = i; cargarPista(null, true); } }, P.i);

function hoja(titulo, ops, fn, actual){
  const h = $("hoja");
  h.innerHTML = '<div class="agarre"></div><h3>' + esc(titulo) + '</h3>' + ops.map(([t, v], k) => '<button class="op' + (v === actual ? " on" : "") + '" data-k="' + k + '"><span>' + esc(t) + '</span>' + (v === actual ? "♪" : "") + '</button>').join("");
  h.classList.add("on"); $("hoja-fondo").classList.add("on");
  h.querySelectorAll(".op").forEach(b => b.onclick = () => { cerrarHoja(); fn(ops[+b.dataset.k][1]); });
  const on = h.querySelector(".op.on"); if (on) on.scrollIntoView({ block:"center" });
}
function cerrarHoja(){ $("hoja").classList.remove("on"); $("hoja-fondo").classList.remove("on"); }
$("hoja-fondo").onclick = cerrarHoja;

// Voces y texto sincronizado (libros narrados por nosotros)
function pintarVoces(){
  const p = P.pistas[P.i]; if (!p || !p.voces) return;
  $("voces").innerHTML = VOCES.filter(v => p.voces[v.id]).map(v => '<button class="voz" data-id="' + v.id + '" aria-pressed="' + (v.id === E.voz) + '"><b>' + esc(v.nombre) + '</b><small>' + esc(v.desc) + '</small></button>').join("");
  $("voces").querySelectorAll(".voz").forEach(b => b.onclick = () => cambiarVoz(b.dataset.id));
}
function cambiarVoz(id){
  if (id === E.voz) return;
  let desde = 0;
  if (P.texto) { const k = fraseActual(A.currentTime); E.voz = id; desde = P.texto.voces[id].marcas[k][2]; }
  else { desde = A.currentTime; E.voz = id; }
  guardar();
  const seguir = !A.paused;
  A.pause();
  A.src = pistaUrl(P.pistas[P.i]); A.playbackRate = E.vel;
  A.addEventListener("loadedmetadata", () => { A.currentTime = desde; A.playbackRate = E.vel; if (seguir) A.play(); }, { once:true });
  if (seguir) A.play().catch(() => {});
  pintarVoces();
}
const spans = {};
function pintarTexto(){
  const t = P.texto; $("texto").innerHTML = ""; ultimaFr = null;
  t.parrafos.forEach((frases, pi) => {
    const p = document.createElement("p");
    frases.forEach((f, fi) => { const s = document.createElement("span"); s.className = "fr"; s.textContent = f + " "; s.onclick = () => irAFrase(pi, fi); spans[pi + "-" + fi] = s; p.appendChild(s); });
    $("texto").appendChild(p);
  });
  $("f-texto").hidden = false;
}
function marcasVoz(){ return (P.texto.voces[E.voz] || Object.values(P.texto.voces)[0]).marcas; }
function fraseActual(t){ const m = marcasVoz(); let k = 0; for (let i = 0; i < m.length; i++) if (m[i][2] <= t + .05) k = i; return k; }
function irAFrase(pi, fi){ const m = marcasVoz().find(x => x[0] === pi && x[1] === fi); if (m) { A.currentTime = m[2]; A.play(); } }
function resaltar(t){
  const m = marcasVoz()[fraseActual(t)], s = spans[m[0] + "-" + m[1]];
  if (s === ultimaFr) return;
  if (ultimaFr) ultimaFr.classList.remove("on");
  s.classList.add("on"); ultimaFr = s;
  if (!A.paused && $("full").classList.contains("on")) { const r = s.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 40) s.scrollIntoView({ behavior:"smooth", block:"center" }); }
}

// ================= Varios =================
let toastT = null;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
pintarPlay();
addEventListener("pagehide", () => guardarProgreso());
document.addEventListener("visibilitychange", () => { if (document.hidden) guardarProgreso(); });
router();
</script>
