name: iPhone con widgets (TestFlight)

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Usar el Xcode más nuevo
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Instalar dependencias
        run: |
          npm ci
          # El kit de Google Cast pide iOS 16 o más nuevo; el plugin venía declarado para iOS 15.
          sed -i '' 's/\.iOS(\.v15)/.iOS(.v16)/' node_modules/@strasberry/capacitor-chromecast/Package.swift
          grep -n "iOS(" node_modules/@strasberry/capacitor-chromecast/Package.swift

      - name: Armar la app web
        run: |
          node tools/armar.js
          # Plugin que le pasa los datos al widget (solo en esta compilación de prueba)
          npm install --no-save capacitor-widget-bridge@8.1.0

      - name: Crear proyecto iPhone
        run: |
          npx cap add ios > $RUNNER_TEMP/c.log 2>&1 || { tail -20 $RUNNER_TEMP/c.log | sed 's/^/::error::cap: /'; exit 1; }
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#0E0C0A' --iconBackgroundColorDark '#0E0C0A' \
            --splashBackgroundColor '#0E0C0A' --splashBackgroundColorDark '#0E0C0A'
          npx cap sync ios
          # App y paquete de plugins con mínimo iOS 16 (lo pide Google Cast)
          sed -i '' 's/\.iOS(\.v1[45])/.iOS(.v16)/' ios/App/CapApp-SPM/Package.swift || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 1[45]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/App/App.xcodeproj/project.pbxproj || true
          grep -n "iOS(" ios/App/CapApp-SPM/Package.swift || true
          # Widget: lo agrega al proyecto (target AudiolibrosWidget) con el grupo compartido
          (gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document) > $RUNNER_TEMP/w.log 2>&1 || { tail -15 $RUNNER_TEMP/w.log | sed 's/^/::error::gem: /'; exit 1; }
          ruby tools/agregar-widget.rb ios/App/App.xcodeproj "$TEAM_ID" 1.0.0 ${{ github.run_number }} > $RUNNER_TEMP/w.log 2>&1 || { tail -25 $RUNNER_TEMP/w.log | sed 's/^/::error::widget: /'; exit 1; }
          cat $RUNNER_TEMP/w.log
          PLIST=ios/App/App/Info.plist
          # Esquema audiolibros:// para que el widget abra la app
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.dmithbuilds.audiolibros" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string audiolibros" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          # Que siga sonando con la pantalla apagada o en otra app
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          # Barra de arriba con letras blancas (la app es oscura)
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIStatusBarStyle UIStatusBarStyleLightContent" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
          # Solo vertical, aunque se gire el teléfono
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          # Chromecast: permiso para buscar teles en la red Wi-Fi de la casa
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Para encontrar tu Chromecast o tele en la red Wi-Fi y transmitir lo que escuchás." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _googlecast._tcp" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string _CC1AD845._googlecast._tcp" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Audiolibros" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Audiolibros" "$PLIST"

      - name: Guardar la clave de App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Compilar (archive)
        working-directory: app/ios/App
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            TARGETED_DEVICE_FAMILY=1 IPHONEOS_DEPLOYMENT_TARGET=16.0 MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive 2>&1 | tee $RUNNER_TEMP/build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "error:|Error:|failed|requires a provisioning" $RUNNER_TEMP/build.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done
            exit $code
          fi

      # Se compila sin firmar y Apple la firma en la nube al exportarla, con la clave de App Store Connect.
      - name: Subir a TestFlight
        shell: bash
        run: |
          set +e
          set -o pipefail
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee $RUNNER_TEMP/export.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -iE "error|failed" $RUNNER_TEMP/export.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done
            exit $code
          fi

