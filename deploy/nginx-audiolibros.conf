# audiolibros.dmith.app — copiar a /etc/nginx/sites-available/audiolibros.dmith.app
server {
    listen 80;
    listen [::]:80;
    server_name audiolibros.dmith.app;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El audio propio (mp3) lo sirve nginx directo, más rápido
    location /contenido/ {
        alias /home/ubuntu/audiolibros-gratis/public/contenido/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }
}
